<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReviseTaTechno</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            margin-top: 30px;
        }
        .subjects-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .subject-card {
            padding: 20px;
            border-radius: 12px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1>ReviseTaTechno</h1>
    <p>Choisis une matière pour commencer</p>

    <div class="subjects-container">
        <!-- Django loop to display each subject -->
        {% for subject in subjects %}
            <a href="#" class="subject-card" style="background-color: {{ subject.color_hex }};">
                {{ subject.name }}
            </a>
        {% empty %}
            <p>Aucune matière disponible pour le moment.</p>
        {% endfor %}
    </div>
</body>
</html>
