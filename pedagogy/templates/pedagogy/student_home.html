{% extends 'base.html' %}

{% block title %}Accueil - Revisetech{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6 text-center">
        
        <p class="text-muted mt-2 mb-4">Choisis une matière pour commencer</p>

        <div class="d-grid gap-2">
            {% for subject in subjects %}
                <a href="{% url 'subject_detail' subject.id %}" class="text-decoration-none">
                    <div class="card text-white py-3 px-3" 
                         style="background-color: {{ subject.color_hex }}; border-radius: 16px; border: none; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: transform 0.1s;">
                        {{ subject.name }}
                    </div>
                </a>
            {% empty %}
                <div class="alert alert-info" role="alert">
                    Aucune matière disponible pour le moment.
                </div>
            {% endfor %}
        </div>

        <!-- Bouton pour rejoindre une classe -->
        <div class="mt-5">
            <a href="{% url 'join_class' %}" class="btn btn-outline-primary rounded-pill px-4">
                Rejoindre une classe
            </a>
        </div>
        
    </div>
</div>
{% endblock %}
