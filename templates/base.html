<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Revisetech{% endblock %}</title>
    
    <!-- Google Fonts : Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Charte graphique Revisetech */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f7;
            color: #333333;
        }
        .btn-primary {
            background-color: #6a1b9a;
            border-color: #6a1b9a;
        }
        .btn-primary:hover {
            background-color: #4a148c;
            border-color: #4a148c;
        }
        .card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <!-- En-tête (Header) -->
    <header class="bg-white shadow-sm mb-4">
        <div class="container d-flex justify-content-between align-items-center py-3">
            <a href="{% url 'student_home' %}" class="text-decoration-none fs-4 fw-bold" style="color: #6a1b9a;">
                Revisetech
            </a>
            
            {% if user.is_authenticated %}
                <div class="d-flex align-items-center gap-3">
                    <span class="text-muted small d-none d-md-inline">{{ user.username }}</span>
                    <form action="{% url 'logout' %}" method="post" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3">Déconnexion</button>
                    </form>
                </div>
            {% endif %}
        </div>
    </header>
    
    <!-- Le contenu spécifique de chaque page viendra s'insérer ici -->
        <div class="container mt-4 pb-5 mb-5">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Barre de navigation mobile (fixe en bas) -->
    <nav class="navbar fixed-bottom bg-white border-top d-md-none">
        <div class="container-fluid justify-content-around">
            <a href="{% url 'student_home' %}" class="text-decoration-none text-center" style="color: #6a1b9a;">
                <span class="d-block fs-4">🏠</span>
                <span class="small">Accueil</span>
            </a>
            <a href="#" class="text-decoration-none text-center text-muted">
                <span class="d-block fs-4">📈</span>
                <span class="small">Progression</span>
            </a>
            <a href="#" class="text-decoration-none text-center text-muted">
                <span class="d-block fs-4">👤</span>
                <span class="small">Profil</span>
            </a>
        </div>
    </nav>
</body>
</html>
